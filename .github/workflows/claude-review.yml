name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: Amperative/.github/.github/workflows/claude-review.yml@dd779295ad77e5bdd6fb144ce2b444b32ff931ae # shared review 2026-11-10
